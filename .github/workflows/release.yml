name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    # Manual run from Actions tab, or commit message containing [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clean existing release if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If the release exists, this deletes the release and the associated tag
          gh release delete v${{ steps.get_version.outputs.version }} --cleanup-tag -y || true

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download sidecars (xray, wintun)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin

          # Xray publishes newest builds as GitHub prereleases; /releases/latest skips them.
          # Prefer newest prerelease; fall back to newest non-draft if none.
          XRAY_TAG=$(curl -fsSL "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=20" \
            | python -c "import sys,json; rels=json.load(sys.stdin); nd=[r for r in rels if not r.get('draft')]; pre=next((r['tag_name'] for r in nd if r.get('prerelease')), None); print(pre or nd[0]['tag_name'])")
          echo "Using Xray ${XRAY_TAG}"

          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            curl -fsSL -o Xray-linux-64.zip \
              "https://github.com/XTLS/Xray-core/releases/download/${XRAY_TAG}/Xray-linux-64.zip"
            unzip -jo Xray-linux-64.zip xray
            mv xray src-tauri/bin/xray-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/xray-x86_64-unknown-linux-gnu

          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            curl -fsSL -o Xray-windows-64.zip \
              "https://github.com/XTLS/Xray-core/releases/download/${XRAY_TAG}/Xray-windows-64.zip"
            unzip -jo Xray-windows-64.zip xray.exe
            mv xray.exe src-tauri/bin/xray-x86_64-pc-windows-msvc.exe
            if unzip -l Xray-windows-64.zip | grep -qi 'wintun.dll'; then
              unzip -jo Xray-windows-64.zip '*wintun.dll'
              mv wintun.dll src-tauri/bin/wintun.dll
            else
              curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
              unzip -jo wintun.zip 'wintun/bin/amd64/wintun.dll'
              mv wintun.dll src-tauri/bin/wintun.dll
            fi
          fi

          echo "Sidecars ready:"
          ls -lah src-tauri/bin/
          # Sanity: print core version when possible
          if [ -x src-tauri/bin/xray-x86_64-unknown-linux-gnu ]; then
            src-tauri/bin/xray-x86_64-unknown-linux-gnu version || true
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # ayatana and classic libappindicator3-dev conflict — ayatana is the Ubuntu/KDE path
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: |
          # npm cacache rename races (EEXIST/ENOENT) are common with Actions cache restores
          npm ci || (npm cache clean --force && rm -rf node_modules && npm ci)

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.prepare-release.outputs.version }}
          releaseName: 'v${{ needs.prepare-release.outputs.version }}'
          releaseBody: 'Automated release (${{ github.event_name }})'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
