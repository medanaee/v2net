name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    # Manual run from Actions tab, or commit message containing [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clean existing release if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If the release exists, this deletes the release and the associated tag
          gh release delete v${{ steps.get_version.outputs.version }} --cleanup-tag -y || true

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download sidecars (xray, sing-box, wintun)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bin

          # Resolve latest stable sing-box tag (skip drafts/prereleases)
          SINGBOX_TAG=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | python -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          SINGBOX_VER="${SINGBOX_TAG#v}"
          echo "Using sing-box ${SINGBOX_TAG}"

          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            # --- Xray ---
            curl -fsSL -o Xray-linux-64.zip \
              https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            unzip -jo Xray-linux-64.zip xray
            mv xray src-tauri/bin/xray-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/xray-x86_64-unknown-linux-gnu

            # --- sing-box ---
            curl -fsSL -o sing-box-linux.tar.gz \
              "https://github.com/SagerNet/sing-box/releases/download/${SINGBOX_TAG}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
            tar -xzf sing-box-linux.tar.gz
            SB_BIN=$(find . -type f -name sing-box | head -n 1)
            mv "$SB_BIN" src-tauri/bin/sing-box-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/sing-box-x86_64-unknown-linux-gnu

          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            # --- Xray (+ wintun.dll from the same package when present) ---
            curl -fsSL -o Xray-windows-64.zip \
              https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip
            unzip -jo Xray-windows-64.zip xray.exe
            mv xray.exe src-tauri/bin/xray-x86_64-pc-windows-msvc.exe
            if unzip -l Xray-windows-64.zip | grep -qi 'wintun.dll'; then
              unzip -jo Xray-windows-64.zip '*wintun.dll'
              mv wintun.dll src-tauri/bin/wintun.dll
            else
              curl -fsSL -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
              unzip -jo wintun.zip 'wintun/bin/amd64/wintun.dll'
              mv wintun.dll src-tauri/bin/wintun.dll
            fi

            # --- sing-box ---
            # Windows Info-ZIP does not expand '*.exe' globs reliably; extract then locate.
            curl -fsSL -o sing-box-windows.zip \
              "https://github.com/SagerNet/sing-box/releases/download/${SINGBOX_TAG}/sing-box-${SINGBOX_VER}-windows-amd64.zip"
            rm -rf sb_extract && mkdir sb_extract
            unzip -o sing-box-windows.zip -d sb_extract
            SB_EXE=$(find sb_extract -type f -name 'sing-box.exe' | head -n 1)
            if [ -z "$SB_EXE" ]; then
              echo "sing-box.exe not found in archive:"
              find sb_extract -type f
              exit 1
            fi
            mv "$SB_EXE" src-tauri/bin/sing-box-x86_64-pc-windows-msvc.exe
          fi

          echo "Sidecars ready:"
          ls -lah src-tauri/bin/
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # ayatana and classic libappindicator3-dev conflict — ayatana is the Ubuntu/KDE path
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: |
          # npm cacache rename races (EEXIST/ENOENT) are common with Actions cache restores
          npm ci || (npm cache clean --force && rm -rf node_modules && npm ci)

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.prepare-release.outputs.version }}
          releaseName: 'v${{ needs.prepare-release.outputs.version }}'
          releaseBody: 'Automated release (${{ github.event_name }})'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
