name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare-release:
    if: contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clean existing release if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If the release exists, this deletes the release and the associated tag
          gh release delete v${{ steps.get_version.outputs.version }} --cleanup-tag -y || true

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Xray Sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/bin
          if [ "${{ matrix.platform }}" == "ubuntu-22.04" ]; then
            curl -L -o Xray-linux-64.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
            unzip Xray-linux-64.zip xray
            mv xray src-tauri/bin/xray-x86_64-unknown-linux-gnu
            chmod +x src-tauri/bin/xray-x86_64-unknown-linux-gnu
          elif [ "${{ matrix.platform }}" == "windows-latest" ]; then
            curl -L -o Xray-windows-64.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip
            unzip Xray-windows-64.zip xray.exe
            mv xray.exe src-tauri/bin/xray-x86_64-pc-windows-msvc.exe
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.prepare-release.outputs.version }}
          releaseName: 'v${{ needs.prepare-release.outputs.version }}'
          releaseBody: 'Automated release triggered by commit: ${{ github.event.head_commit.message }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
